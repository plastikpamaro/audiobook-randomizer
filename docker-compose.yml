name: hoerspielbeutel

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL}
  APP_ORIGIN: ${APP_ORIGIN}
  SESSION_SECRET: ${SESSION_SECRET}
  SETUP_TOKEN: ${SETUP_TOKEN}
  TZ: ${TZ:-Europe/Berlin}
  IMPORT_SYNC_TIME: ${IMPORT_SYNC_TIME:-04:15}

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: migrate
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    security_opt:
      - no-new-privileges:true

  audiobook-randomizer:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - internal
      - caddy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=10001,gid=10001,mode=0750
    security_opt:
      - no-new-privileges:true

  import-worker:
    build:
      context: .
      target: runner
    command: ["node", "dist/import-worker.mjs"]
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      DB_POOL_SIZE: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
